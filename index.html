<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📔</title>
<style>
:root{--accent:#6b8f71;--bg:#faf9f6;--card:#fff;--ink:#2b2b2b;--muted:#8a8a85;--line:#e8e6e0;--soft:color-mix(in srgb,var(--accent) 12%,var(--bg));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1c1b;--card:#242624;--ink:#ecebe7;--muted:#9a9a94;--line:#363835}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
button,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=password],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;min-height:38px;text-align:center}
textarea{min-height:120px;resize:vertical}
.search{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.search>*{min-width:0;max-width:100%}.search .full{grid-column:1/-1}
.moods,.reacts,.eg{display:flex;flex-wrap:wrap;gap:6px}.eg{gap:4px;max-height:150px;overflow:auto}
.mood,.react{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:2px 9px;cursor:pointer;font-size:18px}
.mood.on,.react.on{background:var(--soft);border-color:var(--accent)}
.react{font-size:15px}.react small{font-size:12px;color:var(--muted);margin-left:3px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.entry h3{margin:6px 0;font-size:17px}.entry .body{white-space:pre-wrap;word-break:break-word}
.big{font-size:26px}.who{color:var(--accent);font-weight:600}
.av{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:5px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--accent)}
.av.lg{width:56px;height:56px;font-size:22px;margin:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:10px 0}
.photos img{width:100%;height:130px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.cm{border-top:1px solid var(--line);padding:8px 0;font-size:14px}.cm .t{color:var(--muted);font-size:12px}
.pal{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sl{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.sl span{width:30px}.sl input{flex:1;min-width:0;accent-color:var(--accent)}
.empty,.note{color:var(--muted);text-align:center;padding:24px 0}
.link{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}#lb img{max-width:94%;max-height:90%;border-radius:8px}
</style>
</head>
<body>

<div id="app" class="wrap">
<header><button class="btn" id="bProf" style="display:flex;gap:6px;align-items:center"><span id="myAv"></span><span id="myName">프로필</span></button>
<div class="row"><button class="btn" id="bTheme">🎨 테마</button><button class="btn pri" id="bNew">+ 쓰기</button></div></header>
<div id="msg" class="note" style="display:none"></div>

<div class="card" id="profBox" style="display:none">
<div style="margin-bottom:8px;font-weight:600">내 프로필</div>
<div class="row"><span id="pPrev"></span><label class="btn">사진 변경<input type="file" id="pFile" accept="image/*" hidden></label><button class="link" id="pRm">사진 지우기</button></div>
<input type="text" id="pName" placeholder="이름 (닉네임)" maxlength="20" style="margin-top:10px">
<div style="text-align:right;margin-top:10px"><button class="btn pri" id="pSave">저장</button></div>
</div>

<div class="card" id="themeBox" style="display:none">
<div style="margin-bottom:8px;font-weight:600">테마 컬러</div>
<div class="pal" id="pal"></div>
<div style="margin-top:14px;display:grid;gap:8px">
<label class="sl"><span>색상</span><input type="range" id="sH" min="0" max="360"></label>
<label class="sl"><span>채도</span><input type="range" id="sS" min="15" max="90"></label>
<label class="sl"><span>밝기</span><input type="range" id="sL" min="25" max="65"></label>
<div class="row"><span class="sw on" id="hPrev" style="cursor:default"></span><input type="text" id="hHex" maxlength="7" placeholder="#6b8f71" style="width:110px" aria-label="색상 코드"></div>
</div>
<div class="note" style="padding:8px 0 0;text-align:left;font-size:12px">고른 색은 두 사람 모두에게 똑같이 적용돼요.</div>
</div>

<div class="card" id="editor" style="display:none">
<div class="row" style="margin-bottom:8px"><input type="date" id="eDate" style="width:auto"><input type="text" id="eTitle" placeholder="제목" style="flex:1;min-width:140px"></div>
<div style="font-size:13px;color:var(--muted);margin-bottom:4px">오늘의 감정</div>
<div class="moods" id="eMoods" style="margin-bottom:10px"></div>
<textarea id="eBody" placeholder="오늘 있었던 일, 하고 싶었던 말을 적어 보세요."></textarea>
<div class="thumbs" id="eThumbs"></div>
<div class="row" style="margin-top:10px;justify-content:space-between">
<label class="btn">📷 사진 추가<input type="file" id="eFile" accept="image/*" multiple hidden></label>
<span class="row"><button class="btn" id="eCancel">취소</button><button class="btn pri" id="eSave">저장</button></span></div>
</div>

<div class="card search">
<input type="text" id="qText" class="full" placeholder="제목·내용 검색">
<input type="date" id="qFrom" aria-label="시작일"><input type="date" id="qTo" aria-label="종료일">
<button class="btn full" id="qClear">검색 초기화</button>
</div>
<div id="list"><div class="empty">불러오는 중…</div></div>
</div>
<div id="lb"><img alt=""></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,addDoc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ▼▼ Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)에 나오는 값을 따옴표 안에 붙여넣으세요 ▼▼
const CFG={apiKey:"여기에",authDomain:"여기에",projectId:"여기에",appId:"여기에"};
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(CFG.apiKey==="여기에"){document.body.innerHTML='<div class="wrap"><div class="card note">파일 위쪽 CFG에 Firebase 설정값을 붙여넣어 주세요.</div></div>';throw new Error("no config")}
const fs=getFirestore(initializeApp(CFG));
const MOODS=["😊","🥰","😆","🥳","😌","🤔","😴","😢","😭","😠","🤒","😍"];
const EMOJIS=["❤️","😆","🥹","😮","🤗","👍","😍","🥰","😂","🤣","😭","😢","😡","😳","🥺","😘","😴","🤔","😎","🥳","🙏","👏","🙌","💪","🔥","✨","💖","💕","💗","💔","💌","🌸","🌙","☀️","🍀","🎉","🍰","☕","🐶","🐱","🐰","🐻","👀","💤","🤍","💯","🫶","🤝"];
const COLORS=["#6b8f71","#5b8def","#e07a8c","#d9a441","#9b7fd1","#4aa3a2","#c8715a","#555555","#8aa5b8","#b08968","#d98fb3","#3f5d4a"];
let uid=(()=>{try{let v=localStorage.getItem("xd-uid");if(!v){v="u"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem("xd-uid",v)}return v}catch(e){return"u0"}})(),P={},S={diary:[],comments:[],reacts:[],profs:[]},theme=COLORS[0],photos=[],mood="😊",editing=null,openPick=null,pPhoto=null,unsubs=[];
const show=t=>{const m=$("msg");m.style.display=t?"block":"none";m.textContent=t||""};
const err=e=>show(e&&e.code==="permission-denied"?"권한이 없어요. Firebase 규칙을 확인해 주세요.":"저장하지 못했어요.");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)};
const fmtDate=d=>{const a=d.split("-");return a[0]+"년 "+(+a[1])+"월 "+(+a[2])+"일"};

/* ---------- 데이터 연결 ---------- */
function start(){
const snap=(c,k)=>onSnapshot(collection(fs,c),s=>{S[k]=s.docs.map(d=>({...d.data(),id:d.id}));show("");render()},e=>err(e));
unsubs=[snap("diary","diary"),snap("comments","comments"),snap("reactions","reacts"),snap("profiles","profs"),
onSnapshot(doc(fs,"settings","theme"),d=>{if(d.exists()&&d.data().color)applyTheme(d.data().color)},()=>{})]}

/* ---------- 테마 ---------- */
function applyTheme(c){theme=c;document.documentElement.style.setProperty("--accent",c);try{localStorage.setItem("xd-theme",c)}catch(e){}buildPal()}
try{const c0=localStorage.getItem("xd-theme");if(c0)applyTheme(c0)}catch(e){}
function buildPal(){const p=$("pal");p.innerHTML=COLORS.map(c=>'<button class="sw'+(c.toLowerCase()===theme.toLowerCase()?" on":"")+'" data-c="'+c+'" style="background:'+c+'" aria-label="'+c+'"></button>').join("");
p.querySelectorAll(".sw").forEach(b=>{b.onclick=()=>{setTheme(b.dataset.c);syncHsl()}})}
function setTheme(c){applyTheme(c);if(uid)setDoc(doc(fs,"settings","theme"),{color:c}).catch(err)}
function h2hsl(h){h=h.replace("#","");if(h.length!==6)return[150,25,50];const r=parseInt(h.substr(0,2),16)/255,g=parseInt(h.substr(2,2),16)/255,b=parseInt(h.substr(4,2),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let s=0,hh=0;if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)hh=((g-b)/d)%6;else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;hh*=60;if(hh<0)hh+=360}return[Math.round(hh),Math.round(s*100),Math.round(l*100)]}
function hsl2h(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12,c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return("0"+Math.round(255*c).toString(16)).slice(-2)};return"#"+f(0)+f(8)+f(4)}
function syncHsl(){const v=h2hsl(theme);$("sH").value=v[0];$("sS").value=Math.min(90,Math.max(15,v[1]));$("sL").value=Math.min(65,Math.max(25,v[2]));$("hHex").value=theme;$("hPrev").style.background=theme}
function fromSl(commit){const c=hsl2h(+$("sH").value,+$("sS").value,+$("sL").value);$("hHex").value=c;$("hPrev").style.background=c;commit?setTheme(c):applyTheme(c)}
["sH","sS","sL"].forEach(i=>{$(i).addEventListener("input",()=>fromSl(false));$(i).addEventListener("change",()=>fromSl(true))});
$("hHex").addEventListener("change",()=>{let v=$("hHex").value.trim();if(v[0]!=="#")v="#"+v;if(/^#[0-9a-f]{6}$/i.test(v)){setTheme(v);syncHsl()}else $("hHex").value=theme});
$("bTheme").onclick=()=>{const b=$("themeBox"),o=b.style.display==="none";if(o)syncHsl();b.style.display=o?"block":"none"};

/* ---------- 프로필 ---------- */
const name=id=>{const p=P[id];if(p&&p.name)return p.name;return id===uid?"나":"상대"};
const av=(id,lg)=>{const p=P[id]||{},n=name(id);return p.photo?'<img class="av'+(lg?' lg':'')+'" src="'+esc(p.photo)+'" alt="">':'<span class="av'+(lg?' lg':'')+'">'+esc(Array.from(n)[0]||"?")+'</span>'};
function img(file,max,q,sq){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const c=document.createElement("canvas"),x=c.getContext("2d");
if(sq){const s=Math.min(im.width,im.height);c.width=c.height=max;x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,max,max)}
else{const k=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x.drawImage(im,0,0,c.width,c.height)}
URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};im.onerror=rej;im.src=u})}
const prevP=()=>{const n=$("pName").value||name(uid);$("pPrev").innerHTML=pPhoto?'<img class="av lg" src="'+esc(pPhoto)+'" alt="">':'<span class="av lg">'+esc(Array.from(n)[0]||"?")+'</span>'};
$("bProf").onclick=()=>{const b=$("profBox"),p=P[uid]||{};if(b.style.display==="none"){$("pName").value=p.name||"";pPhoto=p.photo||null;prevP()}b.style.display=b.style.display==="none"?"block":"none"};
$("pRm").onclick=()=>{pPhoto=null;prevP()};
$("pFile").onchange=async ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;try{pPhoto=await img(f,160,.85,true);prevP()}catch(e){show("사진을 불러오지 못했어요.")}};
$("pSave").onclick=()=>setDoc(doc(fs,"profiles",uid),{name:$("pName").value.trim(),photo:pPhoto||""}).then(()=>{$("profBox").style.display="none"}).catch(err);

/* ---------- 표정 ---------- */
const hex=x=>Array.from(x).map(c=>c.codePointAt(0).toString(16)).join("-");
function groups(rs){const m={},o=[];rs.forEach(r=>{if(!m[r.emoji]){m[r.emoji]=[];o.push(r.emoji)}m[r.emoji].push(r)});
return o.map(x=>'<button class="react'+(m[x].some(r=>r.uid===uid)?" on":"")+'" data-r="'+esc(x)+'">'+esc(x)+'<small>'+m[x].length+'</small></button>').join("")}
const picker=()=>'<div class="card" style="margin:8px 0 0;padding:10px"><div class="eg">'+EMOJIS.map(e=>'<button class="mood" data-r="'+e+'">'+e+'</button>').join("")+'</div><div class="row" style="margin-top:8px"><input type="text" class="pin" placeholder="원하는 이모지를 직접 입력 (키보드의 이모지 사용)" style="flex:1"><button class="btn" data-padd="1">추가</button></div></div>';
function toggleR(id,x){const rid=id+"_"+uid+"_"+hex(x),ref=doc(fs,"reactions",rid);(S.reacts.some(r=>r.id===rid)?deleteDoc(ref):setDoc(ref,{entryId:id,uid:uid,emoji:x})).catch(err)}
function addEmojis(id,v){let segs;try{segs=Array.from(new Intl.Segmenter().segment(v)).map(s=>s.segment)}catch(e){segs=[v.trim()]}
segs=segs.filter(s=>/\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(s)).slice(0,5);
if(!segs.length){show("이모지를 입력해 주세요.");return}segs.forEach(s=>{if(!S.reacts.some(r=>r.id===id+"_"+uid+"_"+hex(s)))toggleR(id,s)})}

/* ---------- 목록 ---------- */
function render(){
P={};S.profs.forEach(p=>{P[p.id]=p});$("myAv").innerHTML=av(uid);$("myName").textContent=(P[uid]&&P[uid].name)||"프로필";
const q=$("qText").value.trim().toLowerCase(),f=$("qFrom").value,t=$("qTo").value;
const items=S.diary.filter(e=>(!f||e.date>=f)&&(!t||e.date<=t)&&(!q||((e.title||"")+" "+e.body).toLowerCase().includes(q)))
.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0));
if(!items.length){$("list").innerHTML='<div class="empty">'+(S.diary.length?"조건에 맞는 일기가 없어요.":"아직 일기가 없어요. 첫 장을 써 볼까요?")+'</div>';return}
$("list").innerHTML=items.map(e=>{
const cms=S.comments.filter(c=>c.entryId===e.id).sort((a,b)=>a.createdAt-b.createdAt),rs=S.reacts.filter(r=>r.entryId===e.id);
const ph=(e.photos||[]).map(p=>'<img src="'+esc(p)+'" data-big="1" alt="첨부 사진" loading="lazy">').join("");
return '<div class="card entry" data-id="'+e.id+'"><div class="meta"><span>'+av(e.authorId)+'<span class="who">'+esc(name(e.authorId))+'</span> · '+fmtDate(e.date)+'</span><span class="big">'+esc(e.mood||"")+'</span></div>'+
(e.title?'<h3>'+esc(e.title)+'</h3>':"")+'<div class="body">'+esc(e.body)+'</div>'+(ph?'<div class="photos">'+ph+'</div>':"")+
'<div class="reacts" style="margin-top:10px">'+groups(rs)+'<button class="react" data-pick="1" aria-label="표정 추가">＋</button></div>'+(openPick===e.id?picker():"")+
'<div style="margin-top:10px">'+cms.map(c=>'<div class="cm">'+av(c.authorId)+'<span class="who">'+esc(name(c.authorId))+'</span> '+esc(c.text)+' <span class="t">'+new Date(c.createdAt).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+'</span>'+(c.authorId===uid?' <button class="link" data-dc="'+c.id+'">삭제</button>':"")+'</div>').join("")+
'<div class="row" style="margin-top:8px"><input type="text" class="cin" placeholder="댓글 달기" style="flex:1"><button class="btn" data-c="1">등록</button></div></div>'+
(e.authorId===uid?'<div style="margin-top:8px;text-align:right"><button class="link" data-edit="1">수정</button> · <button class="link" data-del="1">삭제</button></div>':"")+'</div>'}).join("")}
$("list").addEventListener("click",ev=>{
const t=ev.target.closest("button,img")||ev.target,card=t.closest(".entry");if(!card)return;const id=card.dataset.id;
if(t.dataset.big){$("lb").firstChild.src=t.src;$("lb").style.display="flex";return}
if(t.dataset.r){toggleR(id,t.dataset.r);return}
if(t.dataset.pick){openPick=openPick===id?null:id;render();return}
if(t.dataset.padd){const pi=card.querySelector(".pin");addEmojis(id,pi.value);pi.value="";return}
if(t.dataset.c){const inp=card.querySelector(".cin"),v=inp.value.trim();if(!v)return;inp.value="";addDoc(collection(fs,"comments"),{entryId:id,authorId:uid,text:v,createdAt:Date.now()}).catch(err);return}
if(t.dataset.dc){deleteDoc(doc(fs,"comments",t.dataset.dc)).catch(err);return}
if(t.dataset.del){if(confirm("이 일기를 삭제할까요?"))deleteDoc(doc(fs,"diary",id)).catch(err);return}
if(t.dataset.edit){const e=S.diary.find(x=>x.id===id);if(e)openEditor(e)}});
$("list").addEventListener("keydown",ev=>{if(ev.key==="Enter"&&(ev.target.classList.contains("cin")||ev.target.classList.contains("pin")))ev.target.nextElementSibling.click()});
$("lb").onclick=()=>{$("lb").style.display="none"};

/* ---------- 쓰기 ---------- */
function buildMoods(){$("eMoods").innerHTML=MOODS.map(m=>'<button class="mood'+(m===mood?" on":"")+'" data-m="'+m+'">'+m+'</button>').join("");$("eMoods").querySelectorAll(".mood").forEach(b=>{b.onclick=()=>{mood=b.dataset.m;buildMoods()}})}
const thumbs=()=>{$("eThumbs").innerHTML=photos.map(p=>'<img src="'+esc(p)+'" alt="">').join("")};
function openEditor(e){editing=e||null;$("eDate").value=e?e.date:today();$("eTitle").value=e?(e.title||""):"";$("eBody").value=e?e.body:"";mood=e&&e.mood?e.mood:"😊";photos=e?(e.photos||[]).slice():[];buildMoods();thumbs();$("editor").style.display="block";$("eBody").focus()}
$("bNew").onclick=()=>openEditor(null);
$("eCancel").onclick=()=>{$("editor").style.display="none"};
$("eFile").onchange=async ev=>{const fs_=Array.from(ev.target.files);ev.target.value="";
for(const f of fs_){if(photos.length>=4){show("사진은 일기당 4장까지 넣을 수 있어요.");break}try{photos.push(await img(f,900,.7));thumbs()}catch(e){show("사진을 불러오지 못했어요.")}}};
$("eSave").onclick=()=>{const body=$("eBody").value.trim();if(!body){alert("내용을 입력해 주세요.");return}
if(photos.join("").length>900000){show("사진 용량이 너무 커요. 장수를 줄여 주세요.");return}
const data={authorId:editing?editing.authorId:uid,date:$("eDate").value||today(),title:$("eTitle").value.trim(),body:body,mood:mood,photos:photos,createdAt:editing?editing.createdAt:Date.now()};
$("eSave").disabled=true;(editing?setDoc(doc(fs,"diary",editing.id),data):addDoc(collection(fs,"diary"),data)).then(()=>{$("editor").style.display="none";show("")}).catch(err).then(()=>{$("eSave").disabled=false})};
["qText","qFrom","qTo"].forEach(i=>$(i).addEventListener("input",render));
$("qClear").onclick=()=>{$("qText").value=$("qFrom").value=$("qTo").value="";render()};
buildPal();buildMoods();start();
</script>
</body>
</html>
